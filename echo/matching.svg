<text x="630" y="71" font-size="24" font-weight="700">Профиль блогера</text>
<text x="60" y="105" font-size="18">Площадки · подписчики · минимальный IR</text>
<text x="630" y="105" font-size="18">Соцсети · аудитория · показатель IR</text>
<text x="60" y="138" font-size="15" fill="#707070">Условия, заданные бизнесом</text>
<text x="630" y="138" font-size="15" fill="#707070">Данные блогера</text>
