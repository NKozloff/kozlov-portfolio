name: One-time Core Tracker Retina image preparation
on:
  push:
    branches:
      - fix/core-tracker-cover-retina-sharp-20261102
    paths:
      - .github/workflows/core-tracker-retina-temp.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimization dependency
        run: python -m pip install Pillow==11.3.0
      - name: Prepare high-density screenshot variants
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter
          from pathlib import Path

          source = Image.open("assets/core-tracker-cover-2048w.webp").convert("RGB")
          assert source.size == (2048, 1156), source.size
          for width in (3072, 4096):
              height = round(source.height * width / source.width)
              image = source.resize((width, height), Image.Resampling.LANCZOS)
              image = image.filter(ImageFilter.UnsharpMask(radius=1.15, percent=125, threshold=2))
              output = Path(f"assets/core-tracker-cover-{width}w.webp")
              image.save(output, format="WEBP", quality=96, method=6)
              print(output, image.size, output.stat().st_size)
          PY
      - name: Commit generated files to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/core-tracker-cover-3072w.webp assets/core-tracker-cover-4096w.webp
          git commit -m "Generate sharp 3072px and 4096px Core Tracker covers"
          git push origin HEAD:refs/heads/fix/core-tracker-cover-retina-sharp-20261102
